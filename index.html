<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game with Stockfish AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Chess Game with AI</h1>
            <div class="game-info">
                <div class="current-player">
                    Current Player: <span id="current-player">White</span>
                </div>
                <div class="game-status">
                    Status: <span id="game-status">Playing</span>
                </div>
                <div class="game-mode">
                    Mode: <span id="game-mode">Human vs Human</span>
                </div>
                <div class="ai-info" id="ai-info" style="display: none;">
                    AI Difficulty: <span id="ai-difficulty-display">8</span>/20
                </div>
            </div>
        </div>
        
        <div class="chess-board" id="chess-board"></div>
        
        <div class="game-controls">
            <button id="new-game-btn" class="btn">New Game (PvP)</button>
            <button id="ai-game-btn" class="btn">Play vs AI</button>
            <button id="undo-btn" class="btn">Undo Move</button>
        </div>
        
        <div id="ai-setup-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Setup AI Game</h2>
                <div class="ai-setup-form">
                    <div class="form-group">
                        <label for="ai-color">AI Color:</label>
                        <select id="ai-color">
                            <option value="black">Black (You play White)</option>
                            <option value="white">White (You play Black)</option>
                            <option value="random">Random</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ai-difficulty">Difficulty (1-20):</label>
                        <input type="range" id="ai-difficulty" min="1" max="20" value="8">
                        <span id="difficulty-value">8</span>
                    </div>
                    <div class="form-actions">
                        <button id="start-ai-game" class="btn">Start AI Game</button>
                        <button id="cancel-ai-setup" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="captured-pieces">
            <div class="captured-white">
                <h3>Captured White Pieces</h3>
                <div id="captured-white-pieces"></div>
            </div>
            <div class="captured-black">
                <h3>Captured Black Pieces</h3>
                <div id="captured-black-pieces"></div>
            </div>
        </div>
        
        <div id="ai-status" class="ai-status" style="display: none;">
            <span id="ai-thinking">AI is thinking...</span>
        </div>
    </div>

    <script src="frontend.js"></script>
</body>
</html>
