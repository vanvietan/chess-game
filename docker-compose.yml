version: '3.8'

services:
  # Chess game application with local Stockfish
  chess-game-stockfish:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - STOCKFISH_PATH=/usr/bin/stockfish
      - USE_CHESS_API=false
    volumes:
      - ./static:/app/static:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Chess game application with Chess-API.com
  chess-game-api:
    build: .
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - USE_CHESS_API=true
      - CHESS_API_URL=https://chess-api.com/v1
    volumes:
      - ./static:/app/static:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chess-game-stockfish
      - chess-game-api
    restart: unless-stopped
    profiles:
      - with-proxy

  # Redis for session management (optional, for future use)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles:
      - with-redis

networks:
  default:
    name: chess-game-network

volumes:
  redis-data:
