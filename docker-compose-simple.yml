version: '3.8'

services:
  # Chess game application with Chess-API.com only
  chess-game:
    build:
      context: .
      dockerfile: Dockerfile.chess-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USE_CHESS_API=true
      - CHESS_API_URL=https://chess-api.com/v1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: chess-game-network
